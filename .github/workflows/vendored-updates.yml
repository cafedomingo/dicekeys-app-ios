name: Vendored updates

# Dependabot cannot see vendored sources.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Vendored dependencies are behind upstream
    steps:
      - uses: actions/checkout@v7
      - name: Compare with upstream
        run: |
          set -euo pipefail
          notes=""
          vendored=$(grep -oE '[0-9.]+-RELEASE' Packages/DiceKeysCore/Sources/CSodium/VENDOR.md | head -1)
          latest=$(gh api repos/jedisct1/libsodium/releases/latest --jq .tag_name)
          if [ "$vendored" != "$latest" ]; then
            notes+="- libsodium: vendored \`$vendored\`, latest \`$latest\`. Run \`scripts/vendor-libsodium.sh\`."$'\n'
          fi
          # lib-seeded is unmodified, so same content means same tree hash.
          ours=$(git rev-parse HEAD:Packages/DiceKeysCore/Vendor/seeded-crypto/lib-seeded)
          theirs=$(gh api repos/dicekeys/seeded-crypto/git/trees/primary --jq '.tree[] | select(.path == "lib-seeded").sha')
          if [ "$ours" != "$theirs" ]; then
            notes+="- seeded-crypto: upstream \`lib-seeded\` differs from ours. Run \`scripts/update-seeded-crypto.sh\`."$'\n'
          fi
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$notes" ]; then
            echo "Up to date."
            if [ -n "$existing" ]; then gh issue close "$existing" --comment "Up to date as of $(date -u +%F)."; fi
          elif [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$notes"
          else
            gh issue create --title "$TITLE" --label dependencies --body "$notes"
          fi
