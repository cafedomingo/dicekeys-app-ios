name: Build

# Pushes to main, and every pull request, whichever branch it targets, so a stacked PR is
# checked too. A branch push that is also a PR would otherwise run every job twice (the
# push and the pull_request event), and the concurrency group cannot merge them because the
# two events have different refs.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-tools
      - name: Install linters
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install -r scripts/requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: ruff check
        run: ruff check --output-format github scripts
      - name: ruff format
        run: ruff format --check scripts
      - name: shellcheck
        run: shellcheck scripts/*.sh
      # actionlint also runs shellcheck over each workflow `run:` block.
      - name: actionlint
        run: actionlint

  # The Derivation package's suites, with plain SwiftPM on the macOS host: the recorded
  # vectors (the tripwire for any change to derived secrets) and BLAKE2b's known answers.
  crypto:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        working-directory: Packages/Derivation
        run: swift test -c release -Xswiftc -enable-testing --parallel

  # The scanner and its photo corpus, with plain SwiftPM on the macOS host. Release build:
  # the corpus is full-size photos, which take minutes at -Onone and seconds optimized.
  scanner:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        working-directory: Packages/ReadDiceKey
        run: swift test -c release -Xswiftc -enable-testing --parallel

  unused-code:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-tools
      - name: Generate project
        run: swift run --package-path BuildTools xcodegen generate
      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild build -project DiceKeys.xcodeproj -scheme DiceKeys \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= 2>&1 | tee build-ios.log | grep -E 'error:|warning: unre|BUILD|\*\*' || true
          grep -q 'BUILD SUCCEEDED' build-ios.log
      # .swiftlint-analyze.yml limits it to the app target.
      - name: Unused code (swiftlint analyze)
        run: |
          swiftlint analyze --strict --config .swiftlint.yml --config .swiftlint-analyze.yml \
            --compiler-log-path build-ios.log --reporter github-actions-logging
      # Diagnostics only: a flaky artifact service must not fail a build that passed.
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unused-code-logs
          path: "*.log"
          retention-days: 7

  app-tests:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-tools
      - name: Generate project
        run: swift run --package-path BuildTools xcodegen generate
      - name: App unit tests (simulator)
        run: |
          set -o pipefail
          # Pick the newest available iPhone simulator by UDID (names alone can be ambiguous
          # across runtimes on the hosted runners).
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          devices=json.load(sys.stdin)["devices"]
          best=None
          for runtime,devs in devices.items():
              m=re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m: continue
              version=(int(m.group(1)),int(m.group(2)))
              for d in devs:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      key=(version,d["name"])
                      if best is None or key>best[0]: best=(key,d["udid"])
          print(best[1] if best else "")')
          echo "Simulator: $UDID"
          test -n "$UDID"
          # Ad-hoc signing: with no entitlements the app has no keychain access at all and
          # every SecItem call fails with errSecMissingEntitlement (-34018).
          xcodebuild test -project DiceKeys.xcodeproj -scheme DiceKeys \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee test-ios.log | grep -E 'error:|Test Case|Test Suite|passed|failed|\*\*' || true
          grep -q 'TEST SUCCEEDED' test-ios.log
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-tests-logs
          path: "*.log"
          retention-days: 7
