name: Build

# Pushes to main, and pull requests into it. A branch push that is also a PR would
# otherwise run every job twice (the push and the pull_request event), and the concurrency
# group cannot merge them because the two events have different refs.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running build. Every commit on main keeps its own result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs use the runner image's default Xcode, its newest stable release.
jobs:
  # Tool versions are pinned where Dependabot bumps them: SwiftLint in
  # BuildTools/Package.resolved, the others in scripts/requirements-lint.txt.
  lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-tools
      - name: Install linters
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install -q --disable-pip-version-check -r scripts/requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: ruff check
        run: ruff check --output-format github scripts
      - name: ruff format
        run: ruff format --check scripts
      - name: shellcheck
        run: shellcheck scripts/*.sh
      # actionlint also runs shellcheck over each workflow `run:` block.
      - name: actionlint
        run: actionlint

  # The native package (libsodium, seeded-crypto, and the Swift scanner) builds and tests
  # with plain SwiftPM on the macOS host. GoldenVectorTests is the tripwire for any change
  # to derived secrets.
  native-package:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Release build: the scanner corpus is 23 twelve-megapixel photos, which takes
      # minutes at -Onone and seconds optimized.
      - name: Build and test package
        working-directory: Packages/DiceKeysCore
        run: swift test -c release -Xswiftc -enable-testing --parallel

  # Dead code in the app target. The analyzer replays the compiler invocations from a clean
  # build's log, so it builds on its own rather than sharing a build with app-tests.
  unused-code:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-tools
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild build -project DiceKeys.xcodeproj -scheme DiceKeys \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= 2>&1 | tee build-ios.log | grep -E 'error:|warning: unre|BUILD|\*\*' || true
          grep -q 'BUILD SUCCEEDED' build-ios.log
      # .swiftlint-analyze.yml limits it to the app target.
      - name: swiftlint analyze
        run: |
          swiftlint analyze --strict --config .swiftlint.yml --config .swiftlint-analyze.yml \
            --compiler-log-path build-ios.log --reporter github-actions-logging
      # Diagnostics only: a flaky artifact service must not fail a build that passed.
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unused-code-logs
          path: "*.log"
          retention-days: 7

  app-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-tools
      - name: Generate project
        run: xcodegen generate
      # Ad-hoc signing: with no entitlements the app has no keychain access at all and
      # every SecItem call fails with errSecMissingEntitlement (-34018).
      - name: Build for testing (simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project DiceKeys.xcodeproj -scheme DiceKeys \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee build-ios.log | grep -E 'error:|BUILD|\*\*' || true
          grep -q 'TEST BUILD SUCCEEDED' build-ios.log
      - name: App unit tests (simulator)
        run: |
          set -o pipefail
          # Pick the newest available iPhone simulator by UDID (names alone can be ambiguous
          # across runtimes on the hosted runners).
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          devices=json.load(sys.stdin)["devices"]
          best=None
          for runtime,devs in devices.items():
              m=re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m: continue
              version=(int(m.group(1)),int(m.group(2)))
              for d in devs:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      key=(version,d["name"])
                      if best is None or key>best[0]: best=(key,d["udid"])
          print(best[1] if best else "")')
          echo "Simulator: $UDID"
          test -n "$UDID"
          xcodebuild test-without-building -project DiceKeys.xcodeproj -scheme DiceKeys \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath DerivedData \
            2>&1 | tee test-ios.log | grep -E 'error:|Test Case|Test Suite|passed|failed|\*\*' || true
          grep -q 'TEST EXECUTE SUCCEEDED' test-ios.log
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-tests-logs
          path: "*.log"
          retention-days: 7
