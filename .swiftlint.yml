disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - identifier_name
  # Its limit is 2; three-member value tuples such as (rgba, width, height) are deliberate.
  - large_tuple
  - line_length
  - type_body_length
  - type_name
  # String(decoding:as:) is the deliberate, lossy UTF-8 decode; the rule's failable
  # String(bytes:encoding:) would change behaviour on invalid input.
  - optional_data_string_conversion
opt_in_rules:
  - closure_spacing
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
# Run by `swiftlint analyze` in CI's apps job against the clean build's log, with
# .swiftlint-analyze.yml limiting it to the app target.
analyzer_rules:
  - unused_declaration
  - unused_import
included:
  - DiceKeys
  - Tests
  - seed-security-key
  - Packages/DiceKeysCore/Sources/SeededCrypto
  - Packages/DiceKeysCore/Sources/ReadDiceKey
  - Packages/DiceKeysCore/Tests
excluded:
  - Packages/DiceKeysCore/Sources/CSodium
  - Packages/DiceKeysCore/Sources/SeededCryptoNative
  # Generated by scripts/generate-ocr-font-tables.py; regenerating would undo any fixes.
  - Packages/DiceKeysCore/Sources/ReadDiceKey/OcrFontTables.swift
  # Generated by the DiceKeys specification generator (TypeScript); not edited here.
  - DiceKeys/Model/DiceKey/FaceSpecification.swift
unused_import:
  # Foundation re-exports these; without this, a file that imports Foundation only for
  # CGFloat or CGSize has the import reported as unused.
  allowed_transitive_imports:
    - module: Foundation
      allowed_transitive_imports: [CoreFoundation, CoreGraphics, Darwin, Dispatch, ObjectiveC]
