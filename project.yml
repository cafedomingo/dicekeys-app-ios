# XcodeGen spec. The Xcode project is generated, not committed:
#
#   swift run --package-path BuildTools xcodegen generate
#   open DiceKeyVault.xcodeproj
#
# The app's logic comes from two local Swift packages: Packages/Derivation (recipes and
# derived values) and Packages/ReadDiceKey (the scanner).

name: DiceKeyVault
options:
  # The runners have no iOS 27 SDK, so the deployment target is 26.
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # Date-based versioning: scripts/testflight.sh overrides both on every upload with
    # the build date (2026.9.22) and a minute-resolution timestamp (202609222352), so the
    # version always rises and two builds on one day never collide. The literals below are
    # only what local and CI builds report, where the numbers do not matter. No leading
    # zeros: Apple wants plain integers between the periods.
    MARKETING_VERSION: "2026.9.22"
    CURRENT_PROJECT_VERSION: 202609222352
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Xcode's project-settings check nags for this one. It does nothing until the app
    # actually has a String Catalog (localization is still an open item: every string is
    # a literal), but setting it here means the answer survives `xcodegen generate`,
    # which discards anything Xcode writes into the project file.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES

packages:
  Derivation:
    path: Packages/Derivation
  ReadDiceKey:
    path: Packages/ReadDiceKey

targets:
  DiceKeyVault:
    type: application
    platform: iOS
    sources:
      - path: DiceKeyVault
        excludes:
          - "**/.DS_Store"
          - "Resources/AppIcon.icon"
          - "Info.plist"
      # Icon Composer package: the layered Liquid Glass icon, which Xcode compiles into every
      # size and the light, dark and tinted appearances.
      - path: DiceKeyVault/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS)
        PRODUCT_NAME: DiceKeyVault
        PRODUCT_MODULE_NAME: DiceKeyVault
        INFOPLIST_FILE: DiceKeyVault/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: accent-ink
    dependencies:
      - package: Derivation
        product: Derivation
      - package: Derivation
        product: KeyFormats
      - package: ReadDiceKey
        product: DiceKeySpecification
      - package: ReadDiceKey
        product: ReadDiceKey
    scheme:
      testTargets:
        - DiceKeyVaultTests
      gatherCoverageData: true

  DiceKeyVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DiceKeyVaultTests
    dependencies:
      - target: DiceKeyVault
      - package: Derivation
        product: Derivation
      - package: Derivation
        product: KeyFormats
      - package: ReadDiceKey
        product: DiceKeySpecification
      - package: ReadDiceKey
        product: ReadDiceKey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Tests-iOS


  # Screenshots of every screen for visual review, run by scripts/screen-walk.sh. Kept out
  # of the DiceKeyVault scheme so CI does not run it.
  DiceKeyVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/DiceKeyVaultUITests
    dependencies:
      - target: DiceKeyVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).UITests
        TEST_TARGET_NAME: DiceKeyVault

schemes:
  DiceKeyVaultScreenWalk:
    build:
      targets:
        DiceKeyVault: all
        DiceKeyVaultUITests: [test]
    test:
      targets:
        - DiceKeyVaultUITests
